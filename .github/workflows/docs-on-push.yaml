name: Build and deploy docs on push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/docs.yaml
    with:
      tag: ${{ github.ref }}
      # docs/griffe_ext.py imports the package to read what a Magic
      # class writes at run time, so the build needs it installed.
      pip-install: "-e ."
